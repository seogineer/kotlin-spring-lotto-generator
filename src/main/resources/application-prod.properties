server.port=8081
spring.application.name=kotlin-spring-lotto-generator

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/LottoDB?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=seogineer
# 운영 DB 비밀번호는 저장소에 두지 않고 환경변수(SPRING_DATASOURCE_PASSWORD)로 받는다. 없으면 시작 시 실패한다.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false

spring.jpa.properties.hibernate.jdbc.batch_size=2000
spring.jpa.properties.hibernate.order_inserts=true

spring.jpa.open-in-view=false

spring.data.redis.repositories.enabled=false
